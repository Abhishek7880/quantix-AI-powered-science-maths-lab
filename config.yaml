# Project configuration. Every key is optional - anything omitted uses the default in src/config.py.
# CLI flags override these values. Relative paths are relative to this project folder.

# Class names for YOUR use case (order = class id in the label files).
# After editing, regenerate dataset/data.yaml:
#   python -m src.dataset_utils make-yaml --overwrite
class_names:
  - defect

device: auto          # auto | cpu | 0 | 0,1
model_path: ""        # empty = latest trained model in models/registry.json

paths:
  dataset_dir: dataset
  data_yaml: dataset/data.yaml
  models_dir: models
  outputs_dir: outputs
  samples_dir: samples

train:
  base_model: yolo11n.pt   # lightweight COCO-pretrained detector (yolo11s.pt / yolo11m.pt for more accuracy)
  epochs: 50
  imgsz: 640
  batch: 8
  lr0: 0.01
  workers: 2
  patience: 15             # early stopping
  seed: 42

inference:
  conf: 0.25
  iou: 0.45
  imgsz: 640
  max_det: 100

camera:
  index: 0
  width: 1280
  height: 720

