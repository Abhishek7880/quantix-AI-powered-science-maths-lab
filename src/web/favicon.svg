<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <!-- Quantix atom (same design as the header logo; fixed colours because a browser tab can't read the page theme) -->
  <defs>
    <radialGradient id="c"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  </defs>
  <g fill="none" stroke-width="5">
    <ellipse rx="44" ry="15" stroke="#38bdf8"/>
    <ellipse rx="44" ry="15" stroke="#a78bfa" transform="rotate(60)"/>
    <ellipse rx="44" ry="15" stroke="#38bdf8" transform="rotate(120)" opacity=".8"/>
  </g>
  <circle r="15" fill="url(#c)"/>
  <circle r="7" fill="#e0f2fe"/>
