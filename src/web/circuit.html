<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :root[lang="hi"] body { font-family: "Nirmala UI", "Noto Sans Devanagari", Mangal, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { text-decoration: none; font-size: 14px; padding: 6px 10px; }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line);
         background: color-mix(in srgb, var(--panel-solid) 55%, transparent); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.small { padding: 4px 9px; font-size: 12.5px; font-weight: 500; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .btn[aria-pressed="true"] { background: linear-gradient(120deg, var(--btn-a), var(--btn-b)); color: #fff; border-color: transparent; }
  .lang { display: inline-flex; border: 1px solid var(--line); overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 11px; cursor: pointer; }
  .lang button + button { border-left: 1px solid var(--line); }
  main { padding-top: 16px; padding-bottom: 40px; display: grid; grid-template-columns: 230px minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
  @media (max-width: 1350px) { main { grid-template-columns: 210px minmax(0, 1fr); } .side-r { grid-column: 1 / -1; display: grid !important; grid-template-columns: 1fr 1fr; } }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } .side-r { grid-template-columns: 1fr; } .palette-card { max-height: 260px; } }
  .card { padding: 12px 14px; min-width: 0; }
  .lbl { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 2px 0 8px; }
  .palette-card { position: sticky; top: 84px; max-height: calc(100vh - 100px); display: flex; flex-direction: column; padding: 10px; }
  #psearch { width: 100%; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: inherit; font-size: 13.5px; margin-bottom: 8px; }
  #palette { overflow-y: auto; min-height: 0; padding-right: 2px; }
  .pgroup .lbl { margin: 10px 4px 4px; font-size: 10.5px; }
  .pitem { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--ink); font: inherit; font-size: 13.5px; text-align: left; cursor: pointer; }
  .pitem:hover, .pitem.on { background: var(--soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .pic { width: 28px; height: 28px; flex: none; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font: 600 13px var(--f-mono);
         background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 20%, transparent), color-mix(in srgb, var(--accent-2) 20%, transparent)); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
  .toolbar .sep { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
  .toolbar select, .scopehead select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: inherit; font-size: 13px; max-width: 220px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg .btn { border: 0; border-radius: 0; }
  .exnote { margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; background: var(--soft); font-size: 13.5px; }
  .stage { position: relative; height: calc(100vh - 360px); min-height: 420px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
           background: radial-gradient(90% 90% at 50% 30%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 70%), var(--panel-solid); }
  .stage canvas#cv { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .stage canvas#cv:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }
  #pcb { position: absolute; inset: 0; background: radial-gradient(80% 80% at 50% 25%, #1b2a44, #070b14 75%); }
  #pcb canvas { display: block; outline: none; }
  #pcb canvas:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }
  .statusbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 6px; font: 12.5px var(--f-mono); color: var(--muted); }
  .warn { color: var(--warn); font-family: system-ui, sans-serif; }
  .keys { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .filebar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
  .filebar label { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; cursor: pointer; }
  .scopecard { margin-top: 12px; }
  .scopehead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  .scopehead .lbl { margin: 0 6px 0 0; }
  #scope { display: block; width: 100%; height: 190px; border-radius: 12px; border: 1px solid var(--line); }
  #scopeStats { margin-top: 6px; font: 12px var(--f-mono); color: var(--muted); display: grid; gap: 2px; }
  .sstat b { color: var(--c); }
  .side-r { display: flex; flex-direction: column; gap: 14px; }
  #props h3 { margin: 0 0 6px; font: 700 17px var(--f-head); }
  #props .blurb, #props .muted { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
  #props .burnt { color: var(--err); font-weight: 600; font-size: 13.5px; }
  .param { display: grid; gap: 3px; margin-bottom: 9px; }
  .param label { font-size: 13px; font-weight: 600; }
  .param input[type=text], .param select { width: 100%; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: 13.5px var(--f-mono); }
  .param input[aria-invalid="true"] { border-color: var(--err); }
  .param input[type=checkbox] { justify-self: start; width: 18px; height: 18px; }
  .numrow { display: flex; gap: 6px; align-items: center; }
  .numrow .unit { font: 600 12.5px var(--f-mono); color: var(--accent); min-width: 34px; }
  .sliderrow { display: grid; gap: 4px; }
  .sliderrow input[type=range] { width: 100%; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .kv th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 6px 4px 0; width: 40%; border-top: 1px solid var(--line); }
  .kv td { font: 600 13px var(--f-mono); color: var(--accent); padding: 4px 0; border-top: 1px solid var(--line); }
  .pins summary { cursor: pointer; font-weight: 600; font-size: 13px; margin: 8px 0 4px; }
  .pinrow { display: grid; grid-template-columns: 1fr 1.3fr; gap: 6px; align-items: center; margin: 4px 0; font-size: 12.5px; }
  .pinrow select { padding: 4px 6px; border-radius: 7px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: inherit; font-size: 12px; min-width: 0; }
  .mono { font-family: var(--f-mono); }
  #live { font-size: 12.5px; }
  #live th { text-align: left; font-weight: 600; color: var(--muted); padding: 4px 4px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel-solid); }
  #live td { padding: 4px 4px; border-top: 1px solid var(--line); white-space: nowrap; }
  #live tbody tr { cursor: pointer; }
  #live tbody tr:nth-child(even) { background: color-mix(in srgb, var(--accent) 4%, transparent); }
  #live tr.on { background: var(--soft); }
  #live tr.burnt td { color: var(--err); }
  .livewrap { max-height: 360px; overflow: auto; border-radius: 10px; }
  .events { margin: 6px 0 0; padding-left: 18px; color: var(--err); font-size: 13px; }
  .pgroup summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
  .pgroup summary::-webkit-details-marker { display: none; }
  .pgroup summary::before { content: "▸"; font-size: 11px; transition: transform .15s; }
  .pgroup[open] > summary::before { transform: rotate(90deg); }
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  .pgrid .pitem { flex-direction: column; gap: 3px; font-size: 12px; text-align: center; padding: 6px 4px; }
  body.dragging, body.dragging * { cursor: copy !important; user-select: none; }
  .pitem { touch-action: none; user-select: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font: 12px var(--f-mono); background: color-mix(in srgb, var(--panel-solid) 60%, transparent); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: linear-gradient(120deg, var(--btn-a), var(--btn-b)); color: #fff; border-color: transparent; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--sw); cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
  .swatch.on { outline: 3px solid var(--accent); outline-offset: 2px; }
  .swatch.board[data-board="green"] { --sw: #0b6b37; } .swatch.board[data-board="blue"] { --sw: #1d4ed8; } .swatch.board[data-board="black"] { --sw: #111827; }
  .swatch.board[data-board="red"] { --sw: #b91c1c; } .swatch.board[data-board="white"] { --sw: #f1f5f9; } .swatch.board[data-board="purple"] { --sw: #6d28d9; }
  .bands { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .band { width: 12px; height: 26px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25); }
  .bnames { width: 100%; font: 11px var(--f-mono); }
  .smd { font: 700 14px var(--f-mono); color: #fff; background: #111; padding: 2px 10px; border-radius: 4px; letter-spacing: .1em; }
  .settings { margin: 0 0 8px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .settings summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 14px; align-items: center; margin-top: 8px; font-size: 13px; }
  .setgrid select { padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: inherit; font-size: 12.5px; }
  .setrow { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .tip { position: absolute; z-index: 3; left: 12px; top: 12px; max-width: 380px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--accent);
         background: color-mix(in srgb, var(--panel-solid) 94%, transparent); box-shadow: var(--shadow); font-size: 13.5px; }
  .tip ol { margin: 0 0 8px; padding-left: 20px; } .tip li { margin: 3px 0; }
  .ctxmenu { position: absolute; z-index: 4; min-width: 190px; padding: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-solid); box-shadow: var(--shadow); display: grid; gap: 2px; }
  .ctxmenu .mh { font: 600 11px var(--f-mono); color: var(--muted); padding: 4px 8px; }
  .ctxmenu button { text-align: left; padding: 7px 10px; border: 0; border-radius: 8px; background: none; color: var(--ink); font: inherit; font-size: 13.5px; cursor: pointer; }
  .ctxmenu button:hover, .ctxmenu button:focus-visible { background: var(--soft); }
  .stage .fab, .sheet-x, .sheet-back { display: none; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  /* phones: the board first, parts list below it, properties last */
  @media (max-width: 760px) {
    main { display: flex !important; flex-direction: column; padding-top: 8px; }
    main > section.card { order: 1; padding: 8px; }
    .palette-card { order: 2; position: static; max-height: none; }
    #palette { max-height: none; }
    .side-r { order: 3; display: flex !important; }
    .stage { height: 64vh; min-height: 360px; }
    .toolbar { gap: 4px; } .toolbar .sep { display: none; } .toolbar select { max-width: 46vw; }
    #scope { height: 160px; }
    .pgrid { grid-template-columns: repeat(4, 1fr); }
    .pgrid .pitem { font-size: 11px; padding: 6px 2px; }
    .pitem { min-height: 44px; }
    .stage .fab { display: inline-flex; position: absolute; right: 10px; bottom: 10px; z-index: 6; border-radius: 999px; padding: 10px 16px; box-shadow: 0 6px 18px rgba(2,6,16,.35); }
    body.sheet .palette-card { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1001; margin: 0; max-height: 72vh; overflow: auto; border-radius: 18px 18px 0 0;
      padding-bottom: calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 30px rgba(2,6,16,.35); background: var(--panel-solid); backdrop-filter: none; }
    html.in-app body.sheet .palette-card { bottom: calc(60px + env(safe-area-inset-bottom)); max-height: calc(100vh - 150px); padding-bottom: 14px; }
    body.sheet .sheet-back { display: block; position: fixed; inset: 0; z-index: 1000; background: rgba(2,6,16,.5); }
    body.sheet .sheet-x { display: inline-flex; }
    body.sheet .sheet-head { position: sticky; top: -8px; z-index: 1; background: var(--panel-solid); padding: 4px 0; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  /* slides strip (several circuits in one project) */
  .slides { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding: 6px 2px 8px; scrollbar-width: thin; }
  .slides button { flex: none; }
  .slides .slide { min-width: 64px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--ink); font: 600 13px var(--f-mono, monospace); cursor: pointer; }
  .slides .slide[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent); }
  /* dialogs: Kirchhoff, IC creator, shortcuts */
  .dlg { width: min(760px, 94vw); max-height: 86vh; border: 1px solid var(--line); border-radius: 16px; background: var(--panel-solid); color: var(--ink); padding: 0; }
  .dlg::backdrop { background: rgba(2,6,16,.55); }
  .dlghead { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; background: var(--panel-solid); border-bottom: 1px solid var(--line); }
  .dlghead h2 { margin: 0; font-size: 17px; }
  #dlgBody { padding: 12px 16px 18px; overflow: auto; }
  .kgrid { display: grid; gap: 10px; }
  .kbox { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .kbox h4 { margin: 0 0 4px; font-size: 14px; }
  .kterms { font: 13px var(--f-mono, monospace); line-height: 1.7; }
  .kterms .okk { color: var(--ok); font-weight: 700; } .kterms .bad { color: var(--err); font-weight: 700; }
  .keytab { width: 100%; border-collapse: collapse; } .keytab td { padding: 6px 8px; border-top: 1px solid var(--line); } .keytab td:first-child { font: 600 13px var(--f-mono, monospace); white-space: nowrap; color: var(--accent); }
  .ctxmenu button[style] { font-weight: 700; }
</style>

<body>
<header>
  <a class="brand" href="/" aria-label="Quantix — home">
    <svg class="logo" viewBox="-50 -50 100 100" aria-hidden="true">
      <defs><radialGradient id="lgCore"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)" stop-opacity="0"/></radialGradient></defs>
      <g class="lg-orbits" fill="none" stroke-width="3">
        <ellipse rx="44" ry="15" stroke="var(--accent)"/>
        <ellipse rx="44" ry="15" stroke="var(--accent-2)" transform="rotate(60)"/>

    <span>
      <h1 id="tTitle">Circuit Lab</h1>
      <span class="kicker">Quantix</span>
    </span>

  <nav aria-label="Pages"><a href="/" title="Image Inspection — home">Home</a><a href="/measure" title="Measure real objects in a photo">Measure</a><a href="/formulas" title="Formula Library">Formulas</a><a href="/elements" title="Periodic Table">Elements</a><a href="/chemlab" title="Chemistry Lab">Chem Lab</a><a href="/physics" title="Physics Lab">Physics</a><a href="/circuit" title="Circuit Lab" class="on" aria-current="page">Circuits</a><a href="/plc" title="PLC Lab">PLC</a><a href="/handwriting" title="Equation Solver (handwriting)">Solver</a><a href="/converter" title="Unit Converter">Converter</a><a href="/graph" title="Graph Plotter">Graphs</a></nav>
  <span class="spacer"></span>

    <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
  </div>
  <button class="btn small" id="themeBtn" type="button" aria-label="Toggle dark mode">◐</button>
</header>

<main>
  <div class="sheet-back" id="sheetBack" aria-hidden="true"></div>
  <aside class="card palette-card" aria-labelledby="partsLbl">
    <div class="sheet-head"><div class="lbl" id="partsLbl">Parts</div><button class="btn small sheet-x" id="sheetClose" type="button" aria-label="Close">✕</button></div>
    <input id="psearch" type="search" aria-label="Search parts" autocomplete="off">
    <div id="palette"></div>
  </aside>

  <section class="card" aria-label="Circuit board">
    <div class="toolbar" role="toolbar" aria-label="Circuit tools">
      <button class="btn primary" id="runBtn" type="button"></button>
      <button class="btn" id="resetBtn" type="button"></button>
      <label class="keys" for="speed" id="speedLbl">Speed</label>
      <select id="speed"></select>
      <span class="sep" aria-hidden="true"></span>
      <span class="seg" role="group" aria-label="Tool"><button class="btn" id="selBtn" type="button"></button><button class="btn" id="wireBtn" type="button"></button><button class="btn" id="cutBtn" type="button"></button></span>
      <button class="btn" id="undoBtn" type="button"></button>
      <button class="btn" id="redoBtn" type="button"></button>
      <span class="sep" aria-hidden="true"></span>
      <select id="examples" aria-label="Examples"></select>
      <span class="seg" role="group" aria-label="View"><button class="btn" id="vReal" type="button" aria-pressed="true"></button><button class="btn" id="v2d" type="button" aria-pressed="false"></button><button class="btn" id="v3d" type="button" aria-pressed="false"></button></span>
      <label class="keys" for="flowSel" id="flowLbl">Current direction</label>
      <select id="flowSel"></select>
      <button class="btn" id="fitBtn" type="button"></button>
      <button class="btn" id="newBtn" type="button"></button>
    </div>
    <p class="exnote" id="exNote" hidden></p>
    <details class="settings" id="settings"></details>
    <div class="slides" id="slides" role="tablist" aria-label="Slides"></div>
    <div class="stage" id="stage">
      <div class="tip" id="tip" hidden></div>
      <div class="ctxmenu" id="ctxMenu" role="menu" hidden></div>
      <canvas id="cv" tabindex="0" role="application" aria-label="Circuit board. Arrow keys move the selected part, R rotates, W draws wires, [ and ] select parts." aria-describedby="hint"></canvas>
      <div id="pcb" hidden></div>
      <button class="btn primary fab" id="partsFab" type="button" aria-expanded="false">＋ Parts</button>
    </div>
    <div class="statusbar"><span id="status"></span><span id="warn" class="warn" role="status" hidden></span></div>
    <p class="keys" id="hint"></p>
    <p class="keys" id="tip3d" hidden></p>
    <div class="filebar">
      <button class="btn small" id="saveBtn" type="button"></button>
      <button class="btn small" id="openBtn" type="button"></button>
      <button class="btn small" id="shareBtn" type="button"></button>
      <button class="btn small" id="pngBtn" type="button"></button>
      <button class="btn small" id="bomBtn" type="button"></button>
