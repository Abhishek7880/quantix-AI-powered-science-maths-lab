<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :root[lang="hi"] body { font-family: "Nirmala UI", "Noto Sans Devanagari", Mangal, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { text-decoration: none; font-size: 14px; padding: 6px 10px; }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line);
         background: color-mix(in srgb, var(--panel-solid) 55%, transparent); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.small { padding: 4px 9px; font-size: 12.5px; font-weight: 500; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .lang { display: inline-flex; border: 1px solid var(--line); overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 11px; cursor: pointer; }
  .lang button + button { border-left: 1px solid var(--line); }
  main { padding-top: 16px; padding-bottom: 40px; display: grid; grid-template-columns: 240px minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
  @media (max-width: 1350px) { main { grid-template-columns: 220px minmax(0, 1fr); } .side-r { grid-column: 1 / -1; display: grid !important; grid-template-columns: 1fr 1fr 1fr; } }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } .side-r { grid-template-columns: 1fr; } }
  .card { padding: 12px 14px; min-width: 0; }
  .lbl { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 2px 0 8px; }
  .side-l, .side-r { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .exbtn { display: block; width: 100%; text-align: left; padding: 7px 10px; margin-bottom: 4px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--ink); font: inherit; font-size: 13.5px; cursor: pointer; }
  .exbtn:hover, .exbtn[aria-pressed="true"] { background: var(--soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .exbtn[aria-pressed="true"] { color: var(--accent); font-weight: 600; }
  #tags { width: 100%; font-size: 12.5px; border-collapse: collapse; }
  #tags th { text-align: left; font: 600 12px var(--f-mono); color: var(--accent); padding: 2px 6px 2px 0; }
  #tags input, #tags select { width: 100%; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: inherit; font-size: 12px; }
  .tagwrap { max-height: 420px; overflow: auto; }
  .top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .top select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: inherit; font-size: 13px; }
  .mode { font: 700 12px var(--f-mono); padding: 4px 10px; border-radius: 999px; background: #64748b; color: #fff; letter-spacing: .1em; }
  .mode.on { background: #16a34a; box-shadow: 0 0 12px rgba(22,163,74,.6); }
  .keys { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
  .exnote { margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; background: var(--soft); font-size: 13.5px; }
  #scene { display: block; width: 100%; height: 300px; border-radius: 14px; border: 1px solid var(--line);
           background: radial-gradient(90% 90% at 50% 20%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%), var(--panel-solid); }
  .io { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  @media (max-width: 700px) { .io { grid-template-columns: 1fr; } }
  .iorow { display: flex; flex-wrap: wrap; gap: 6px; }
  .inbtn { padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 60%, transparent); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; user-select: none; touch-action: none; }
  .inbtn b { font-family: var(--f-mono); color: var(--accent); }
  .inbtn.button { border-radius: 999px; }
  .inbtn.on { background: #16a34a; color: #fff; border-color: #16a34a; } .inbtn.on b { color: #fff; }
  .inbtn:disabled { cursor: default; opacity: .9; border-style: dashed; }
  .lamp { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 10px; border: 1px solid var(--line); font-size: 13px; }
  .lamp b { font-family: var(--f-mono); color: var(--accent); }
  .lamp i { width: 14px; height: 14px; border-radius: 50%; background: #475569; display: inline-block; }
  .lamp.on i { background: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  #ladder { overflow-x: auto; padding-bottom: 6px; }
  .rung { display: flex; align-items: stretch; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .rung.sel { background: var(--soft); border-radius: 10px; }
  .rnum { flex: none; width: 34px; border: 1px solid var(--line); border-radius: 8px; background: none; color: var(--muted); font: 600 12px var(--f-mono); cursor: pointer; }
  .rungbody { flex: 1; min-width: max-content; }
  .note { font: 12px var(--f-mono); color: var(--accent-3, #34d399); margin: 0 0 2px 10px; }
  .line { display: flex; align-items: center; }
  .rail { width: 4px; align-self: stretch; background: var(--accent); border-radius: 2px; min-height: 64px; }
  .series { display: flex; align-items: center; }
  .w { display: inline-block; width: 18px; height: 3px; background: color-mix(in srgb, var(--muted) 60%, transparent); }
  .w.grow { flex: 1; min-width: 24px; }
  .w.on, .or.on > .branch > .fillw { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,.7); }
  .or { display: flex; flex-direction: column; gap: 6px; border-left: 3px solid color-mix(in srgb, var(--muted) 60%, transparent); border-right: 3px solid color-mix(in srgb, var(--muted) 60%, transparent); padding: 4px 0; }
  .or.on { border-color: #22c55e; }
  .branch { display: flex; align-items: center; }
  .fillw { flex: 1; height: 3px; min-width: 6px; background: color-mix(in srgb, var(--muted) 60%, transparent); }
  .el { display: inline-flex; flex-direction: column; align-items: center; min-width: 74px; padding: 3px 6px; border-radius: 9px; border: 2px solid transparent; background: none; color: var(--ink); cursor: pointer; font: inherit; }
  .el:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .el.sel { border-color: var(--accent); background: var(--soft); }
  .el .nm { font-size: 11px; color: var(--muted); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .el .sym { font: 700 20px/1.1 var(--f-mono); letter-spacing: -1px; }
  .el .ad { font: 600 11px var(--f-mono); color: var(--accent); }
  .el .cmp { font: 600 12px var(--f-mono); padding: 4px 6px; border: 2px solid currentColor; border-radius: 6px; }
  .contact.closed .sym, .contact.closed .cmp { color: #22c55e; }
  .contact.on { background: rgba(34,197,94,.12); }
  .out .sym { font-size: 20px; }
  .out.on .sym { color: #22c55e; text-shadow: 0 0 8px rgba(34,197,94,.8); }
  .out.box { border: 2px solid color-mix(in srgb, var(--muted) 50%, transparent); min-width: 120px; }
  .out.box.on { border-color: #22c55e; }
  .out.box.sel { border-color: var(--accent); }
  .fb { font: 700 12px var(--f-mono); }
  .bar { display: block; width: 100%; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--muted) 30%, transparent); margin: 3px 0; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #22c55e; }
  .outs { display: flex; flex-direction: column; gap: 4px; }
  #props h3 { margin: 0 0 8px; font: 700 16px var(--f-head); }
  .param { display: grid; gap: 3px; margin-bottom: 9px; }
  .param label { font-size: 13px; font-weight: 600; }
  .param input, .param select { width: 100%; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: 13.5px var(--f-mono); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .muted { color: var(--muted); font-size: 13.5px; }
  #tc { width: 100%; border-collapse: collapse; font-size: 13px; }
  #tc th, #tc td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--line); }
  .mono { font-family: var(--f-mono); }
  #st { margin: 0; padding: 10px; border-radius: 10px; background: #06101e; color: #b9f6ca; font: 12px/1.55 var(--f-mono); white-space: pre-wrap; max-height: 360px; overflow: auto; }
  .filebar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .toolbox { margin-bottom: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--accent) 4%, transparent); }
  .toolbox .lbl { margin: 0 0 6px; }
  .toolrow { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
  .tool { display: inline-flex; flex-direction: column; align-items: center; min-width: 54px; padding: 4px 6px; border-radius: 9px; border: 1px solid var(--line);
          background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); cursor: pointer; font: inherit; }
  .tool:hover { border-color: var(--accent); background: var(--soft); }
  .tsym { font: 700 16px var(--f-mono); } .tname { font: 600 10px var(--f-mono); color: var(--muted); }
  .plus { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1px dashed var(--accent); background: none; color: var(--accent); font: 700 16px/1 system-ui; cursor: pointer; margin: 0 4px; }
  .plus:hover { background: var(--soft); } .plus.small { width: 24px; height: 24px; font-size: 14px; align-self: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font: 12px var(--f-mono); background: color-mix(in srgb, var(--panel-solid) 60%, transparent); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--accent); } .chip.on { background: linear-gradient(120deg, var(--btn-a), var(--btn-b)); color: #fff; border-color: transparent; }
  .sublbl { font-size: 12px; color: var(--muted); }
  .numrow { display: flex; gap: 6px; } .numrow input { flex: 1; } .numrow select { width: auto; }
  .scenewrap { position: relative; }
  .tip { position: absolute; z-index: 3; left: 10px; top: 10px; max-width: 400px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--panel-solid) 94%, transparent); box-shadow: var(--shadow); font-size: 13.5px; }
  .tip ol { margin: 0 0 8px; padding-left: 20px; } .tip li { margin: 3px 0; }
  .cfg { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .cfg summary { cursor: pointer; font-weight: 600; font-size: 13px; }
  .cfggrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 16px; margin-top: 8px; }
  .cfgrow { display: grid; grid-template-columns: 1fr 1.2fr auto; gap: 8px; align-items: center; font-size: 13px; }
  .cfgrow output { font: 600 12px var(--f-mono); color: var(--accent); min-width: 64px; text-align: right; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>

<body>
<header>
  <a class="brand" href="/" aria-label="Quantix — home">
    <svg class="logo" viewBox="-50 -50 100 100" aria-hidden="true">
      <defs><radialGradient id="lgCore"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)" stop-opacity="0"/></radialGradient></defs>
      <g class="lg-orbits" fill="none" stroke-width="3">
        <ellipse rx="44" ry="15" stroke="var(--accent)"/>
        <ellipse rx="44" ry="15" stroke="var(--accent-2)" transform="rotate(60)"/>
        <ellipse rx="44" ry="15" stroke="var(--accent)" transform="rotate(120)" opacity=".75"/>
      </g>
      <circle r="12" fill="url(#lgCore)" class="lg-core"/>
    </svg>
    <span>
      <h1 id="tTitle">PLC Lab</h1>
      <span class="kicker">Quantix</span>
    </span>
  </a>
  <nav aria-label="Pages"><a href="/" title="Image Inspection — home">Home</a><a href="/measure" title="Measure real objects in a photo">Measure</a><a href="/formulas" title="Formula Library">Formulas</a><a href="/elements" title="Periodic Table">Elements</a><a href="/chemlab" title="Chemistry Lab">Chem Lab</a><a href="/physics" title="Physics Lab">Physics</a><a href="/circuit" title="Circuit Lab">Circuits</a><a href="/plc" title="PLC Lab" class="on" aria-current="page">PLC</a><a href="/handwriting" title="Equation Solver (handwriting)">Solver</a><a href="/converter" title="Unit Converter">Converter</a><a href="/graph" title="Graph Plotter">Graphs</a></nav>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Language / भाषा">
    <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
    <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
  </div>
  <button class="btn small" id="themeBtn" type="button" aria-label="Toggle dark mode">◐</button>
</header>

<main>
  <section class="side-l">
    <div class="card"><div class="lbl" id="exLbl">Examples</div><div id="exList"></div></div>
    <div class="card" id="tagsBox"><div class="lbl" id="tagsLbl">Tag names</div><div class="tagwrap"><table id="tags"></table></div></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <div class="card">
      <div class="top">
        <button class="btn primary" id="runBtn" type="button"></button>
        <span class="mode" id="mode" aria-live="polite"></span>
        <label class="keys" for="scanSel" id="scanLbl">Scan time</label>
        <select id="scanSel"><option value="5">5 ms</option><option value="10">10 ms</option><option value="20">20 ms</option><option value="50">50 ms</option><option value="100">100 ms</option></select>
        <span class="keys" id="scanInfo"></span>
        <span class="spacer"></span>
        <label class="keys" for="sceneSel" id="sceneLbl">Machine</label>
        <select id="sceneSel"></select>
      </div>
      <p class="exnote" id="exNote" hidden></p>
      <div class="scenewrap"><div class="tip" id="tip" hidden></div><canvas id="scene" role="img" aria-label="Animated machine controlled by the PLC outputs"></canvas></div>
      <details class="cfg" id="sceneCfg" hidden></details>
      <div class="io" aria-labelledby="ioLbl">
        <span class="sr-only" id="ioLbl">Inputs &amp; outputs</span>
        <div><div class="lbl" id="inLbl">Inputs</div><div class="iorow" id="inputs"></div></div>
        <div><div class="lbl" id="outLbl">Outputs</div><div class="iorow" id="outputs"></div></div>
      </div>
    </div>
    <div class="card">
      <div class="lbl" id="ladderLbl">Ladder program</div>
      <div class="toolbox" id="toolbox"></div>
      <div class="toolbar" role="toolbar" aria-label="Ladder tools">
        <button class="btn" id="addRung" type="button"></button>
        <button class="btn" id="addContact" type="button"></button>
        <button class="btn" id="addBranch" type="button"></button>
        <button class="btn" id="addOut" type="button"></button>
        <button class="btn danger" id="delBtn" type="button"></button>
        <button class="btn" id="undoBtn" type="button" aria-label="Undo (Ctrl+Z)"></button>
        <button class="btn" id="redoBtn" type="button" aria-label="Redo (Ctrl+Y)"></button>
        <button class="btn" id="newBtn" type="button"></button>
      </div>
      <div id="ladder"></div>
      <p class="keys" id="keys"></p>
      <div class="filebar">
        <button class="btn small" id="saveBtn" type="button"></button>
        <button class="btn small" id="openBtn" type="button"></button>
        <button class="btn small" id="shareBtn" type="button"></button>
        <input type="file" id="fileIn" accept=".json,application/json" hidden>
      </div>
    </div>
  </section>

  <section class="side-r">
    <div class="card"><div class="lbl" id="propsLbl">Properties</div><div id="props"></div></div>
    <div class="card"><div class="lbl" id="tcLbl">Timers &amp; counters</div><table id="tc"></table></div>
    <div class="card"><div class="lbl" id="stLbl">Structured Text</div><pre id="st"></pre><div class="row"><button class="btn small" id="copyBtn" type="button"></button></div></div>
  </section>
</main>
<div id="say" class="sr-only" aria-live="polite"></div>
