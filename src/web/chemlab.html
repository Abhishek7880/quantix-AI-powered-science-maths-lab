<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :root[lang="hi"] body { font-family: "Nirmala UI", "Noto Sans Devanagari", Mangal, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 18px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { text-decoration: none; font-size: 14px; padding: 6px 10px; }
  .spacer { flex: 1; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; border: 1px solid var(--line);
         background: color-mix(in srgb, var(--panel-solid) 55%, transparent); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.small { padding: 4px 9px; font-size: 12.5px; font-weight: 500; }
  .btn.big { width: 100%; padding: 10px 14px; font-size: 15px; margin-top: 6px; }
  .lang { display: inline-flex; border: 1px solid var(--line); overflow: hidden; }
  .lang button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; padding: 5px 11px; cursor: pointer; }
  .lang button + button { border-left: 1px solid var(--line); }
  main { padding-top: 16px; padding-bottom: 40px; display: grid; grid-template-columns: 330px minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
  @media (max-width: 1400px) { main { grid-template-columns: 300px minmax(0, 1fr); } .side-r { grid-column: 1 / -1; display: grid !important; grid-template-columns: 1fr 1fr 1fr; } }
  @media (max-width: 950px) { main { grid-template-columns: minmax(0, 1fr); } .side-r { grid-template-columns: 1fr; } }
  .card { padding: 12px 14px; min-width: 0; }
  .lbl { font: 600 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 2px 0 8px; }
  .muted { color: var(--muted); font-size: 13px; }
  .mono { font-family: var(--f-mono); }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .tabs button { flex: 1; padding: 6px 8px; border-radius: 9px; border: 1px solid var(--line); background: none; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: linear-gradient(120deg, var(--btn-a), var(--btn-b)); color: #fff; border-color: transparent; }
  #search { width: 100%; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: inherit; font-size: 13.5px; margin-bottom: 8px; }
  #shelf { max-height: 560px; overflow: auto; }
  .sgroup .lbl { margin: 8px 2px 4px; font-size: 10.5px; }
  .chem { display: flex; gap: 8px; align-items: center; width: 100%; padding: 5px 8px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--ink); font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .chem:hover, .chem.on { background: var(--soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .cf { font: 600 12px var(--f-mono); color: var(--accent); min-width: 74px; }
  .ptable { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; }
  .el { aspect-ratio: 1; padding: 0; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); background: color-mix(in srgb, var(--c) 22%, transparent);
        color: var(--ink); font: 700 9.5px var(--f-mono); cursor: pointer; min-width: 0; }
  .el:hover, .el.on { background: var(--c); color: #0b1020; }
  .el.wide { aspect-ratio: auto; display: flex; gap: 6px; padding: 5px 8px; font-size: 12.5px; text-align: left; width: 100%; margin-bottom: 3px; }
  .elist { display: grid; gap: 2px; }
  .selname { font-size: 14px; } .hz { margin: 6px 0; padding: 5px 9px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 12.5px; font-weight: 600; }
  .addrow { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; font-weight: 600; }
  .addrow input, .addrow select, .ctl select { padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel-solid) 70%, transparent); color: var(--ink); font: 13.5px var(--f-mono); min-width: 0; }
  .unit { font: 600 12px var(--f-mono); color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font: 12px var(--f-mono); background: color-mix(in srgb, var(--panel-solid) 60%, transparent); color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--accent); } .chip.on { background: linear-gradient(120deg, var(--btn-a), var(--btn-b)); color: #fff; border-color: transparent; }
  .stage { position: relative; height: calc(100vh - 300px); min-height: 460px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
           background: radial-gradient(80% 80% at 50% 25%, #1d2a40, #070b14 75%); }
  #scene3d { position: absolute; inset: 0; } #scene3d canvas { display: block; outline: none; } #scene3d canvas:focus-visible { box-shadow: inset 0 0 0 3px var(--accent); }
  .meters { position: absolute; z-index: 2; right: 12px; top: 12px; display: grid; gap: 8px; }
  .meter { min-width: 130px; padding: 6px 12px; border-radius: 12px; background: rgba(6,12,26,.82); color: #e6f0ff; border: 1px solid rgba(120,170,255,.25); }
  .meter .k { font: 600 10px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: #93a6c4; }
  .meter .v { font: 700 20px var(--f-mono); }
  #phVal { display: inline-flex; align-items: center; gap: 8px; } #phVal::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--ph); }
  .tip { position: absolute; z-index: 3; left: 12px; top: 12px; max-width: 380px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--accent); background: color-mix(in srgb, var(--panel-solid) 94%, transparent); box-shadow: var(--shadow); font-size: 13.5px; }
  .tip ol { margin: 0 0 8px; padding-left: 20px; } .tip li { margin: 3px 0; }
  .ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; font-size: 13px; }
  .ctl label { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
  .ctl input[type=range] { width: 160px; }
  .ctl output { font: 600 12px var(--f-mono); color: var(--accent); min-width: 110px; }
  .side-r { display: flex; flex-direction: column; gap: 14px; }
  .ev { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 8px; }
  .ev.live { border-color: #22c55e; box-shadow: 0 0 0 1px rgba(34,197,94,.3) inset; }
  .ev.none { border-color: var(--warn); }
  .evt { font: 600 12px var(--f-mono); color: var(--accent); }
  .ev.live .evt { color: #22c55e; } .ev.none .evt { color: var(--warn); }
  .eq { font: 600 14px/1.5 "Cambria Math", Cambria, Georgia, serif; margin: 4px 0; word-break: break-word; }
  .see { font-size: 13px; color: var(--muted); }
  #contents table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #contents td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(0,0,0,.3); vertical-align: middle; }
  #safety ul { margin: 0; padding-left: 4px; list-style: none; font-size: 13px; color: var(--warn); }
  #safety li { margin: 3px 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
</style>

<body>
<header>
  <a class="brand" href="/" aria-label="Quantix — home">
    <svg class="logo" viewBox="-50 -50 100 100" aria-hidden="true">
      <defs><radialGradient id="lgCore"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)" stop-opacity="0"/></radialGradient></defs>

        <ellipse rx="44" ry="15" stroke="var(--accent)"/>

        <ellipse rx="44" ry="15" stroke="var(--accent)" transform="rotate(120)" opacity=".75"/>
      </g>
      <circle r="12" fill="url(#lgCore)" class="lg-core"/>
    </svg>
    <span>
      <h1 id="tTitle">Chemistry Lab</h1>
      <span class="kicker">Quantix</span>
    </span>
  </a>
  <nav aria-label="Pages"><a href="/" title="Image Inspection — home">Home</a><a href="/measure" title="Measure real objects in a photo">Measure</a><a href="/formulas" title="Formula Library">Formulas</a><a href="/elements" title="Periodic Table">Elements</a><a href="/chemlab" title="Chemistry Lab" class="on" aria-current="page">Chem Lab</a><a href="/physics" title="Physics Lab">Physics</a><a href="/circuit" title="Circuit Lab">Circuits</a><a href="/plc" title="PLC Lab">PLC</a><a href="/handwriting" title="Equation Solver (handwriting)">Solver</a><a href="/converter" title="Unit Converter">Converter</a><a href="/graph" title="Graph Plotter">Graphs</a></nav>
  <span class="spacer"></span>
  <div class="lang" role="group" aria-label="Language / भाषा">
    <button type="button" data-lang="en" aria-pressed="true" lang="en">EN</button>
    <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिन्दी</button>
  </div>
  <button class="btn small" id="themeBtn" type="button" aria-label="Toggle dark mode">◐</button>
</header>

<main>
  <section style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <div class="card">
      <div class="lbl" id="shelfLbl">Chemical shelf</div>
      <div class="tabs" role="tablist"><button type="button" role="tab" id="tabC" aria-selected="true">Compounds</button><button type="button" role="tab" id="tabE" aria-selected="false">Elements</button></div>
      <input id="search" type="search" aria-label="Search chemicals" autocomplete="off">
      <div id="shelf"></div>
    </div>
  </section>

  <section class="card" aria-label="Lab bench">
    <div class="ctl" style="margin:0 0 10px">
      <select id="expSel" aria-label="Experiments"></select>
      <label for="containerSel" id="containerLbl">Container</label><select id="containerSel"></select>
      <button class="btn small" id="emptyBtn" type="button">Empty</button>
    </div>
    <div class="stage">
      <div id="scene3d"></div>
      <div class="tip" id="tip" hidden></div>
      <div class="meters" aria-live="off">
        <div class="meter"><div class="k" id="tLbl">Temperature</div><div class="v" id="tVal">25.0 °C</div></div>
        <div class="meter"><div class="k" id="phLbl">pH</div><div class="v" id="phVal">—</div></div>
        <div class="meter"><div class="k" id="volLbl">Volume</div><div class="v" id="volVal" style="font-size:15px">0 mL</div></div>
      </div>
    </div>
    <div class="ctl">
      <label for="heat"><span id="burnerLbl">Burner</span> 🔥</label><input type="range" id="heat" min="0" max="2000" step="50" value="0"><output id="heatOut" for="heat"></output>
      <button class="btn small" id="flameBtn" type="button">🔥 Flame test</button>
      <label><input type="checkbox" id="stir"> <span id="stirLbl">Stir</span></label>
      <label for="speedSel" id="speedLbl">Speed</label><select id="speedSel"><option value="1">×1</option><option value="2">×2</option><option value="5">×5</option><option value="20">×20</option></select>
    </div>
    <div class="card" style="margin-top:12px;padding:10px 12px" id="addBox" aria-live="polite"></div>
  </section>

  <section class="side-r">
    <div class="card"><div class="lbl" id="obsLbl">Reactions</div><div id="eqs"></div></div>
    <div class="card"><div class="lbl" id="contLbl">In the beaker</div><div id="contents"></div></div>
    <div class="card"><div class="lbl" id="safeLbl">Safety</div><div id="safety"></div></div>
  </section>
</main>
<div id="say" class="sr-only" aria-live="polite"></div>
